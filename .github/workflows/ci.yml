name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test (no installations)
        run: |
          mkdir -p .reports/ci
          python3 -m unittest discover -s tests -v > .reports/ci/tests.log 2>&1 || { cat .reports/ci/tests.log; exit 1; }
          cat .reports/ci/tests.log
      - name: Dry-run smoke tests
        run: |
          python3 agentready.py plan --profile starter
          python3 agentready.py brewfile --profile power
          python3 agentready.py install --profile starter
          python3 agentready.py coverage --profile power --json
          python3 agentready.py report --profile life --output .reports/life-onboarding.md
          python3 agentready.py verify --service homebox --url http://127.0.0.1:17745
          python3 agentready.py brief --date 2026-10-15 --fixture-dir examples/fixtures --message-query 待办
          python3 agentready.py brief
      - name: Personal offline smoke
        run: python3 agentready.py personal-brief
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-${{ matrix.os }}-${{ matrix.python-version }}
          path: .reports/ci/
